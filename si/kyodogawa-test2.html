<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>kyodogawa</title>
    <meta name="description" content="360° Image - A-Frame">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      html { touch-action: manipulation; }

      #controls {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: flex;
        justify-content: center;
      }

      #controls button {
        font-size: 3vw;
        padding: 1vw 2vw;
        margin: 1vw;
      }
    </style>
  </head>
  <body>
    <a-scene vr-mode-ui="enabled: false">
      <a-sky src="./img/si_kyodogawa.JPG"></a-sky>
      <a-camera id="camera" look-controls="magicWindowTrackingEnabled: false"></a-camera>
    </a-scene>

    <div id="controls">
      <button id="zoomin">+</button>
      <button id="map">Map</button>
      <button id="zoomout">−</button>
    </div>

    <script>
      const camera = document.querySelector('#camera');

      // --- カメラが初期化されてからFOVを操作 ---
      camera.addEventListener('loaded', () => {
        let fov = camera.getAttribute('camera').fov;

        document.getElementById('zoomin').addEventListener('click', () => {
          fov = Math.max(10, fov - 5);
          camera.setAttribute('camera', 'fov', fov);
        });

        document.getElementById('zoomout').addEventListener('click', () => {
          fov = Math.min(100, fov + 5);
          camera.setAttribute('camera', 'fov', fov);
        });
      });

      // --- Mapボタン ---
      document.getElementById('map').addEventListener('click', () => {
        const url = 'https://maps.gsi.go.jp/#16/35.6438346/138.717695/';
        window.open(url, '_blank');
      });
    </script>
  </body>
</html>
